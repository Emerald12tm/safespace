<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeSpace — Check-In</title>
  <meta name="description" content="Check in with how you're feeling right now, and SafeSpace will shape the next few minutes around it.">

  <!-- Open Graph / Twitter Card (link previews) — see index.html for
       a fuller explanation of this block. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SafeSpace">
  <meta property="og:title" content="SafeSpace — Check-In">
  <meta property="og:description" content="Check in with how you're feeling right now, and SafeSpace will shape the next few minutes around it.">
  <meta property="og:image" content="images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SafeSpace — Check-In">
  <meta name="twitter:description" content="Check in with how you're feeling right now.">
  <meta name="twitter:image" content="images/og-image.png">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <script>
    // Applies the saved theme before first paint, avoiding a flash of the
    // default (dark) theme on every page navigation.
    (function() {
      try {
        if (localStorage.getItem('safespace_theme') === 'light') {
          document.body.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Custom Cursor Element -->
  <div class="custom-cursor"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="logo" aria-label="SafeSpace home">
      <span class="logo-icon"></span>
      <span class="logo-text">SafeSpace</span>
    </a>
    <button id="navToggleBtn" class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="check-in.html" class="nav-item active">Check-in</a>
      <a href="activities.html" class="nav-item">Activities</a>
      <a href="account.html" class="nav-item">Account</a>
      <button id="themeToggleBtn" class="nav-btn" aria-label="Toggle theme">Light Mode</button>
    </nav>
  </header>

  <!-- Check-In Content Section -->
  <main class="hero-container check-in-container">
    <h1 class="hero-title">Where's your mind at today?</h1>
    <p class="hero-description">Select the word that best fits how you're feeling right now.</p>

    <!-- Emotion Selection Grid — clicking a card (script.js section 4)
         marks it .selected and enables "Continue". Each `data-emotion`
         value is saved to localStorage and read back on activities.html
         to tailor that page (see script.js section 5). -->
    <div class="emotion-grid">
      <button type="button" class="emotion-card" data-emotion="bright">
        <img id="bright_image" class="emotion-icon" src="images/bright.png" alt="Bright">
        <p>Bright</p>
      </button>

      <button type="button" class="emotion-card" data-emotion="steady">
        <img id="steady_image" class="emotion-icon" src="images/steady.png" alt="Steady">
        <p>Steady</p>
      </button>

      <button type="button" class="emotion-card" data-emotion="heavy">
        <img id="heavy_image" class="emotion-icon" src="images/heavy.png" alt="Heavy">
        <p>Heavy</p>
      </button>

      <button type="button" class="emotion-card" data-emotion="overloaded">
        <img id="overloaded_image" class="emotion-icon" src="images/overloaded.png" alt="Overloaded">
        <p>Overloaded</p>
      </button>
    </div>

    <!-- Disabled until a mood card above is clicked. -->
    <button id="submitCheckInBtn" class="primary-btn" disabled>Continue</button>
    <!-- Skips straight to Activities with no mood saved (clears any
         previous selection too). -->
    <button id="skipCheckInBtn" class="skip-btn" type="button">Skip for now</button>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-links">
      <a href="index.html">Home</a>
      <a href="check-in.html">Check-in</a>
      <a href="activities.html">Activities</a>
      <a href="account.html">Account</a>
    </nav>
    <p class="footer-copy">&copy; <span id="footerYear">2026</span> SAFESPACE</p>
    <p class="footer-credit">Made by Shaurya Gupta</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
