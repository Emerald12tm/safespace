<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeSpace — Reset Password</title>
  <meta name="description" content="Set a new password for your SafeSpace account.">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
</head>
<body>

  <script>
    // Applies the saved theme before first paint, avoiding a flash of the
    // default (dark) theme on every page navigation.
    (function() {
      try {
        if (localStorage.getItem('safespace_theme') === 'light') {
          document.body.classList.add('light-theme');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Custom Cursor Element -->
  <div class="custom-cursor"></div>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="logo" aria-label="SafeSpace home">
      <span class="logo-icon"></span>
      <span class="logo-text">SafeSpace</span>
    </a>
    <button id="navToggleBtn" class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav class="nav-links">
      <a href="index.html" class="nav-item">Home</a>
      <a href="check-in.html" class="nav-item">Check-in</a>
      <a href="activities.html" class="nav-item">Activities</a>
      <a href="account.html" class="nav-item">Account</a>
      <button id="themeToggleBtn" class="nav-btn" aria-label="Toggle theme">Light Mode</button>
    </nav>
  </header>

  <!-- Reset Password Content — reached only via the link Supabase
       emails from account.html's "Forgot password?" (script.js section
       11). Clicking that link logs the visitor into a short-lived
       "recovery" session automatically (handled by the Supabase client
       itself, no code needed here for that part); this form just sets
       a new password on that session (script.js section 12). -->
  <main class="hero-container account-container">
    <div class="account-panel">
      <h1 class="hero-title">Set a new password</h1>
      <p class="hero-description">Choose a new password for your SafeSpace account.</p>

      <form id="resetPasswordForm" class="demo-entry-form account-form">
        <label>
          New password
          <input type="password" id="resetPassword" name="password" placeholder="At least 6 characters" minlength="6" autocomplete="new-password" required>
        </label>

        <button type="submit" class="primary-btn">Update Password</button>
        <p id="resetStatus" class="demo-status"></p>
        <a href="account.html" class="primary-btn secondary-btn">Back to Account</a>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <nav class="footer-links">
      <a href="index.html">Home</a>
      <a href="check-in.html">Check-in</a>
      <a href="activities.html">Activities</a>
      <a href="account.html">Account</a>
    </nav>
    <p class="footer-copy">&copy; <span id="footerYear">2026</span> SAFESPACE</p>
    <p class="footer-credit">Made by Shaurya Gupta</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
